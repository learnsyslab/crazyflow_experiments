# Trajectory sets of the identification flights, named by `trajectories` in the experiment section
# of config.toml.
# Each entry takes the keys of control.config.build_trajectory except the origin: trajectory, n_runs,
# time (s per cycle), scaling (m along the trajectory's own axes), axes (the world axes its own x, y, z
# are placed on) and optionally yaw_mode and yaw_setting. The "_thrust" sets are faster, for drones
# with more thrust. Every set ends with a trajectory of zero size, a hover at the origin, so the
# recording ends with a hover like it begins with the one of the takeoff.
[trajectory_sets]
# Low-level identification with lol_sysid.py: chirps along z, x and y, then a yaw chirp while hovering
lol_sysid = [
    { trajectory = "chirp_1d", n_runs = 3, time = 10.0, scaling = [5.5, 3.5, 1.5], axes = "zyx" },
    { trajectory = "chirp_1d", n_runs = 3, time = 10.0, scaling = [1.0, 1.0, 0.0], axes = "xyz" },
    { trajectory = "chirp_1d", n_runs = 3, time = 10.0, scaling = [1.0, 1.0, 0.0], axes = "yxz" },
    { trajectory = "chirp_1d", n_runs = 3, time = 10.0, scaling = [0.0, 0.0, 0.0], axes = "xyz", yaw_mode = "chirp", yaw_setting = 1.0 },
]
