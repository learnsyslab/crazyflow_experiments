obstacles = [[-0.5952511429786682, 0.6061187982559204, 0.0], [-0.19837862253189087, 0.5998428463935852, 0.0], [-0.02609270066022873, 0.20298467576503754, 0.0], [-0.2003815621137619, -0.18774467706680298, 0.0], [0.19617629051208496, 0.621827244758606, 0.0], [-0.39951029419898987, 0.20067864656448364, 0.0], [0.40579113364219666, 0.20579855144023895, 0.0], [-0.016219481825828552, -0.59394371509552, 0.0], [0.6024446487426758, 0.6278328895568848, 0.0], [0.20104502141475677, -0.18950968980789185, 0.0]]

[sim]
physics = "first_principles" #physics model of the sim, e.g., first_principles, so_rpy_rotor_drag
fps = 60
